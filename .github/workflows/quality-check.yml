# PR 免疫系統:每個 PR 自動跑文章健康掃描 + 建置驗證 + 站內連結檢查
# 待擴充:terminology 檢查、版本欄位比對
# 外部連結存活檢查刻意不放這裡:打真實網路,慢且會因對方站況假紅(見 check-links.mjs)
name: Quality Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一 PR/分支連續 push 時只跑最新一版(省額度防連發)
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Article health scan(免疫系統)
        run: node scripts/tools/article-health.mjs --all

      - name: Build(sync + astro build)
        run: npm run build

      # 要放在 build 之後 — 它比對的是 dist/ 的實體檔案。
      # 擋的是「站內連結指向沒建出來的頁面」,例如 /dashboard/ 的貢獻 CTA
      # 曾指向從未存在的 /about/貢獻指南/,在漏斗最關鍵的位置放了一個 404。
      - name: 站內連結檢查
        run: npm run check-internal
